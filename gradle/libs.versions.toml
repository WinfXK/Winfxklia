okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
camera-core = { module = "androidx.camera:camera-core", name = "camera-core", version.ref = "camerax_version" }
camera-camera = { module = "androidx.camera:camera-camera2", name = "camera-camera2", version.ref = "camerax_version" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", name = "camera-lifecycle", version.ref = "camerax_version" }
camera-view = { module = "androidx.camera:camera-view", name = "camera-view", version.ref = "camerax_version" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }